services:

  mysql:
    image: mysql:8.0
    container_name: collegekhoj-mysql

    environment:
      MYSQL_DATABASE: collegekhoj
      MYSQL_USER: collegekhoj_app
      MYSQL_PASSWORD: collegekhoj_password
      MYSQL_ROOT_PASSWORD: root_password_change_me

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password_change_me"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: collegekhoj-backend

    environment:
      NODE_ENV: production
      PORT: 4000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: collegekhoj
      DB_USER: collegekhoj_app
      DB_PASSWORD: collegekhoj_password
      DB_CONNECTION_LIMIT: 10

      JWT_SECRET: change_this_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12

      CORS_ORIGIN: http://100.54.105.246:5173

      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300

    ports:
      - "4000:4000"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: collegekhoj-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  mysql_data:
